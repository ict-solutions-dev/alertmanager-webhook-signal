version: "2"

run:
  modules-download-mode: vendor

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
  exclusions:
    rules:
      # Test helpers may intentionally ignore some returns.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
